---
name: go_repo

dirs:
  - path: "cmd/app"
    files:
      - name: "main.go"
        content: |
          package main

          import "fmt"

          func main() {
          	fmt.Println("Hello, World!")
          }

  - path: "internal"
    files:
      - name: ".gitkeep"
        content: ""

  - path: "pkg"
    files:
      - name: ".gitkeep"
        content: ""

  - path: ".github"
    files:
      - name: "dependabot.yml"
        content: |
          version: 2
          updates:
            - package-ecosystem: gomod
              directory: /
              schedule:
                interval: weekly
              commit-message:
                prefix: deps

            - package-ecosystem: github-actions
              directory: /
              schedule:
                interval: weekly
              commit-message:
                prefix: ci

  - path: ".github/workflows"
    files:
      - name: "ci.yml"
        content: |
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          jobs:
            check:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-go@v5
                  with:
                    go-version-file: go.mod
                - name: gofmt, vet and tests
                  run: make check

      - name: "dependabot-automerge.yml"
        raw: true # contains GitHub Actions ${{ }} expressions, which must not be templated by ri
        content: |
          name: Dependabot auto-merge

          # Turns on auto-merge for Dependabot's patch and minor updates. GitHub then merges the pull request
          # once the required "check" job from ci.yml passes; major updates are left for a human to review.
          # Needs "Allow auto-merge" enabled and a branch protection rule on main requiring the "check" status,
          # otherwise there is nothing to wait for (see the README).

          on: pull_request

          permissions:
            contents: write
            pull-requests: write

          jobs:
            automerge:
              runs-on: ubuntu-latest
              if: github.event.pull_request.user.login == 'dependabot[bot]'
              steps:
                - name: Fetch Dependabot metadata
                  id: metadata
                  uses: dependabot/fetch-metadata@v2
                  with:
                    github-token: ${{ secrets.GITHUB_TOKEN }}

                - name: Enable auto-merge for patch and minor updates
                  if: steps.metadata.outputs.update-type != 'version-update:semver-major'
                  run: gh pr merge --auto --squash "$PR_URL"
                  env:
                    PR_URL: ${{ github.event.pull_request.html_url }}
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  - path: "./"
    files:
      - name: "go.mod"
        content: |
          module {{ .Name }}

          go 1.27

      - name: "Makefile"
        content: |
          BIN := bin/app

          .PHONY: build run test lint fmt check clean

          build:
          	go build -o $(BIN) ./cmd/app

          run:
          	go run ./cmd/app

          test:
          	go test ./...

          lint:
          	go vet ./...

          fmt:
          	gofmt -l -w .

          # Formatting, vet and tests: what CI runs
          check:
          	@test -z "$$(gofmt -l .)" || (echo "gofmt needed:"; gofmt -l .; exit 1)
          	$(MAKE) lint test

          clean:
          	rm -rf bin

      - name: "README.md"
        content: |
          # {{ .Name }}

          ## Development

          ```sh
          make build   # build bin/app
          make test    # run all tests
          make lint    # go vet
          make check   # gofmt, vet and tests (what CI runs)
          ```

          ## Dependency updates

          Dependabot opens weekly pull requests for Go modules and GitHub Actions. Patch and minor updates
          are merged automatically once CI passes; major updates wait for review. To turn this on:

          1. Enable auto-merge: `gh repo edit --enable-auto-merge`
          2. Require the `check` job on `main` (Settings > Branches > Branch protection rule > "Require status
             checks to pass"). Without it there is nothing to wait for, and auto-merge cannot work.

      - name: "CLAUDE.md"
        content: |
          # CLAUDE.md

          This file provides guidance to Claude Code (claude.ai/code) when working with code in this repository.

          ## Commands

          - Build: `make build` (outputs `bin/app`)
          - Run: `make run`
          - Test all: `make test`
          - Test a single test: `go test -run TestName ./path/to/pkg`
          - Lint: `make lint` (`go vet ./...`)
          - Format: `make fmt`
          - Everything CI checks (gofmt, vet, tests): `make check`

          ## Layout

          - `cmd/app`: program entrypoint
          - `internal/`: private packages, not importable by other modules
          - `pkg/`: packages intended to be imported by other modules
          - `.github/workflows/ci.yml`: CI, runs `make check` on pushes to `main` and on pull requests
          - `.github/dependabot.yml` and `.github/workflows/dependabot-automerge.yml`: weekly dependency updates; patch and minor ones auto-merge once CI passes. This needs "Allow auto-merge" and a branch protection rule requiring the `check` job.

      - name: ".gitignore"
        content: |
          # Build output
          bin/
          dist/

          # Binaries for programs and plugins
          *.exe
          *.exe~
          *.dll
          *.so
          *.dylib

          # Test binary, build with `go test -c`
          *.test

          # Coverage output
          *.out
          coverage.html

          # Local environment and tooling
          .env
          .idea/
          .vscode/
          .DS_Store

commands:
  - name: git
    args: ["init"]
    optional: true
  - name: go
    args: ["mod", "tidy"]
    optional: true
