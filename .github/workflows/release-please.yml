name: Release Please

# Keeps a release pull request open on main. It collects the Conventional Commits merged since the last
# release, proposes the next version and a CHANGELOG.md entry, and merging it tags and publishes the release.
# Nothing is released until that pull request is merged.
#
# The release PR is opened by the github-actions bot, which the repository's Actions policy treats as a
# first-time contributor, so its CI run waits for approval: click "Approve and run workflows" on the PR,
# wait for the required "check" job to pass, then merge.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
