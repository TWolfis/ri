name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets release-please run CI on its release pull request

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt, vet and tests
        run: make check
