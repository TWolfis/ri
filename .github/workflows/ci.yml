name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets release-please run CI on its release pull request

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt, vet and tests
        run: make check

      - name: Coverage
        run: make cover

      # Needs a CODECOV_TOKEN repository secret. Without it (or on pull requests that cannot read secrets,
      # such as Dependabot's) the upload fails quietly and does not fail the build.
      - uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
